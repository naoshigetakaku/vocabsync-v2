<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="VocabSync">
  <title>VocabSync</title>

  <defs>
    <!-- Apple Music's gradient, turned upside down: the weight overhead and
         the light pooling at the foot. -->
    <linearGradient id="body" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9E103A"/>
      <stop offset="0.45" stop-color="#D81B4A"/>
      <stop offset="1" stop-color="#FF7D92"/>
    </linearGradient>

    <!-- Glass, kept faint on purpose: a sheen bright enough to notice is one
         bright enough to turn the deep top pale, which would undo the point
         of running the gradient upside down. -->
    <radialGradient id="sheen" cx="256" cy="-82" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- The bright line where a curved surface turns away from you. -->
    <linearGradient id="rim" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="shape">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="512" height="512" fill="url(#body)"/>
    <ellipse cx="256" cy="-82" rx="360" ry="300" fill="url(#sheen)"/>
    <rect x="0" y="2" width="512" height="3" fill="url(#rim)"/>
  </g>

  <!-- A letterform over a writing rule: the whole idea of the app in two strokes. -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M177 323 L256 138 L335 323"/>
    <path d="M209 267 L304 267"/>
    <path d="M163 374 L349 374"/>
  </g>
</svg>
